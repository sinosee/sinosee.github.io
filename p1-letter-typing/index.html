<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="字母打字">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffe4f4">
<meta name="description" content="小一英文字母打字：100 關，由小楷字母、大楷、詞語，玩到短文。每關最多三粒星。">
<title>英文字母打字</title>
<link rel="preload" href="andika-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<!-- Letterforms: Andika by SIL, Latin bold subset. License: OFL.txt -->
<style>
@font-face{
  font-family:"Andika";
  font-style:normal;
  font-weight:700;
  font-display:swap;
  src:url("andika-latin-700.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
:root{
  --ink:#5a2d78;
  --muted:#7a568f;
  --deep:#c43b86;
  --gold:#f5a623;
  --gold-d:#e08a00;
  --empty:#eadcf2;
  --shadow:#f3c3dc;
  --ok:#1a9a52;
  --soft:#e36a2c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{
  color:var(--ink);
  font-family:"PingFang HK","PingFang TC","Noto Sans CJK HK","Microsoft JhengHei","Heiti TC",sans-serif;
  background:
    radial-gradient(circle at 6% 8%,#ffe29a 0,transparent 26%),
    radial-gradient(circle at 96% 0,#ffb3de 0,transparent 30%),
    radial-gradient(circle at 90% 92%,#b8f3d8 0,transparent 28%),
    radial-gradient(circle at 4% 96%,#c9dcff 0,transparent 26%),
    linear-gradient(165deg,#fff0f8 0%,#e7f7ff 42%,#fff6d8 100%);
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
button,a{font-family:inherit;touch-action:manipulation}
button{cursor:pointer;border:none;color:inherit;background:none;padding:0}
button:focus-visible,a:focus-visible{outline:4px solid #4dabf7;outline-offset:3px}
.letters{font-family:"Andika","Chalkboard SE","Comic Sans MS",Verdana,sans-serif;font-weight:700}
.screen{
  position:fixed;inset:0;z-index:1;
  display:none;flex-direction:column;
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}
.screen.on{display:flex}
[hidden]{display:none!important}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
#booterr{
  position:relative;z-index:9;margin:0;padding:12px 16px;
  background:#ffd6d6;color:#8d1428;font-weight:900;text-align:center;
}

/* ---------- home ---------- */
.homeTop{
  flex:none;
  width:min(1100px,calc(100% - 16px));
  margin:8px auto 0;
  padding:10px 12px 8px;
  border-radius:28px;
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(100deg,#ff8ec8,#ffd15c,#7ddeb3,#7ecbff,#c9b6ff) border-box;
  border:4px solid transparent;
  box-shadow:0 6px 0 #f3c3dc;
}
.brand{
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.mascot{
  width:64px;height:64px;border-radius:50%;
  object-fit:cover;object-position:center;
  border:3px solid #ff8ec8;
  box-shadow:0 3px 0 #ffc2de;background:#ffd6ea;
}
h1{
  margin:0;
  font-size:clamp(28px,4.6vw,46px);
  font-weight:900;letter-spacing:.04em;line-height:1.1;
  text-align:center;
}
.brandSub{
  margin:2px 0 0;text-align:center;
  font-size:clamp(16px,2.4vw,22px);font-weight:900;color:var(--deep);
}
.statRow{
  margin-top:6px;
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
}
.totalPill,.soundToggle{
  display:inline-flex;align-items:center;gap:6px;
  min-height:42px;padding:4px 14px;border-radius:999px;
  background:#fff8d6;border:3px solid #ffd15c;
  font-size:clamp(16px,2.3vw,22px);font-weight:900;
}
.soundToggle{background:#e7fff4;border-color:#7ddeb3}
.soundToggle input{width:22px;height:22px;accent-color:#1a9a52}
.banner{
  margin:6px auto 0;max-width:760px;
  padding:6px 12px;border-radius:16px;
  background:#fff0f6;border:3px solid #ff8ec8;
  text-align:center;font-weight:900;
  font-size:clamp(16px,2.2vw,22px);color:var(--deep);
}
.jumps{
  margin-top:8px;
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
}
.jump{
  min-height:40px;padding:0 10px;border-radius:999px;
  background:#fff;border:3px solid var(--jc,#ffb3d4);
  font-size:clamp(13px,1.7vw,16px);font-weight:900;
  box-shadow:0 3px 0 var(--jc,#ffb3d4);
}
.jump.on{background:var(--jc,#ffb3d4);color:#4a245c;transform:translateY(1px);box-shadow:0 1px 0 var(--jc,#ffb3d4)}
#scroller{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  scroll-snap-type:y proximity;
  width:min(1100px,calc(100% - 16px));
  margin:8px auto 8px;
}
.page{
  scroll-snap-align:start;
  box-sizing:border-box;
  height:var(--page-h,auto);
  min-height:var(--page-h,100%);
  padding:0;
}
@media (min-width:861px){
  .page{max-height:var(--page-h,none);overflow:hidden}
}
@media (max-width:860px){
  .page{height:auto;max-height:none;overflow:visible}
}
.pageInner{
  min-height:100%;
  display:flex;flex-direction:column;gap:8px;
  padding:12px;
  border-radius:30px;
  background:var(--wash,#fff0f6);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.8);
}
.page h2{
  margin:0;text-align:center;
  font-size:clamp(22px,3vw,32px);font-weight:900;line-height:1.2;
}
.blurb{
  margin:0;text-align:center;font-weight:800;color:var(--muted);
  font-size:clamp(14px,2vw,18px);
}
.grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-rows:1fr 1fr;
  gap:10px;
  min-height:220px;
}
.lvl{
  min-height:0;padding:8px 6px 10px;overflow:hidden;
  border-radius:24px;background:#fff;
  border:5px solid var(--c,#ff8ec8);
  box-shadow:0 6px 0 var(--c,#ff8ec8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
}
.lvl:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c,#ff8ec8)}
.lvl.just{animation:pop .45s ease}
.lnum{font-size:clamp(15px,2vw,20px);font-weight:900}
.phase{
  font-size:clamp(13px,1.7vw,16px);font-weight:900;
  padding:1px 8px;border-radius:999px;background:#fff6fb;
}
.preview{
  font-size:clamp(15px,2vw,22px);line-height:1.2;
  text-align:center;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.stars{font-size:clamp(18px,2.6vw,26px);letter-spacing:.06em;line-height:1}
.star{color:#d9c6e6;-webkit-text-stroke:1px #b894cc}
.star.on{color:var(--gold);-webkit-text-stroke:1px #e08a00;text-shadow:0 1px 0 #e08a00}
.meta{font-size:clamp(12px,1.5vw,14px);font-weight:800;color:var(--muted)}
.footNote{
  flex:none;margin:0 auto 8px;text-align:center;
  font-size:14px;font-weight:800;color:var(--muted);
}
a.backsite{color:var(--deep);text-decoration:none;font-weight:900}
a.backsite:hover{text-decoration:underline}

/* ---------- play ---------- */
#play{overflow:hidden}
.topbar{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:8px 10px 2px;flex-wrap:wrap;
}
.iconbtn{
  min-width:52px;min-height:52px;border-radius:18px;
  background:#fff;border:3px solid #ffb3d4;
  box-shadow:0 4px 0 #ffb3d4;
  font-size:26px;display:flex;align-items:center;justify-content:center;
}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #ffb3d4}
.pill{
  min-height:38px;display:inline-flex;align-items:center;
  padding:4px 12px;border-radius:999px;
  font-size:clamp(14px,2vw,20px);font-weight:900;white-space:nowrap;
  border:3px solid transparent;
}
.pill.lv{background:#ffe3f2;border-color:#ff8ec8}
.pill.phase{background:#efe4ff;border-color:#c9b6ff}
.pill.prog{background:#e3f4ff;border-color:#7ecbff}
.pill.miss{background:#fff1e4;border-color:#ffb088}
.pill.time{background:#e9fff3;border-color:#7ddeb3}
.pill.live{background:#fff6d0;border-color:#ffd15c}
.spacer{flex:1}
.bar{
  flex:none;height:12px;margin:4px 12px 0;
  background:rgba(255,255,255,.8);border-radius:999px;overflow:hidden;
  border:2px solid #fff;
}
.bar>span{
  display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,#ff8ec8,#ffd15c,#7ddeb3,#7ecbff);
  transition:width .25s ease;
}
.stage{
  flex:1 1 auto;min-height:0;overflow:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:6px 12px;
}
.ask{margin:0;font-size:clamp(16px,2.6vw,26px);font-weight:900;color:var(--muted)}
.hints{width:min(920px,100%);display:flex;flex-direction:column;gap:6px}
.hint{
  margin:0;padding:8px 12px;border-radius:16px;
  background:#fff7cc;border:3px solid #ffd15c;
  font-size:clamp(15px,2.2vw,22px);font-weight:900;line-height:1.4;text-align:center;
}
.coach{
  margin:0;min-height:1.3em;text-align:center;
  font-size:clamp(18px,3vw,30px);font-weight:900;color:#0e6f8a;
}
.letterCard,.wordCard,.textCard{
  width:min(92vw,760px);
  border-radius:32px;background:#fff;
  border:6px solid transparent;
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(135deg,#ff8ec8,#ffd15c,#7ddeb3,#7ecbff,#c9b6ff) border-box;
  box-shadow:0 8px 0 #f3c3dc;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 16px 12px;
}
.letterCard{min-height:min(30dvh,280px)}
.glyph{
  font-size:clamp(92px,20vmin,200px);line-height:.95;color:var(--ink);
}
.glyph.pop{animation:pop .32s ease-out}
.wordShow{font-size:clamp(42px,8vw,84px);letter-spacing:.08em;line-height:1.1}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.slot{
  min-width:42px;min-height:52px;padding:4px 8px;
  border-radius:14px;background:#fff6fb;border:3px solid #ffd0e6;
  font-size:clamp(26px,4vw,40px);line-height:1.1;
  display:flex;align-items:center;justify-content:center;
}
.slot.spaceSlot{font-family:inherit;font-size:clamp(14px,2vw,18px);font-weight:900;color:#0e6f8a}
.slot:not(.done):not(.now){background:#fff6fb}
.slot.done{background:#e5ffef;border-color:#7ddeb3;color:var(--ok)}
.slot.now{
  border-color:#2f9cf5;background:#e7f4ff;color:#123a66;
  box-shadow:0 0 0 4px #c6e6ff;transform:translateY(-3px);
}
.passage{
  margin:0;width:100%;
  font-size:clamp(26px,4.4vw,44px);line-height:1.55;
  text-align:left;word-break:break-word;
}
.ch.done{color:var(--ok)}
.ch.now{
  background:#fff3bf;border-radius:10px;
  box-shadow:inset 0 -4px 0 #ffd15c;
}
.ch.sp{display:inline-flex;min-width:.55em;justify-content:center}
.ch.sp.now{
  font-family:"PingFang HK","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:.48em;font-weight:900;color:#0e6f8a;
  padding:0 6px;vertical-align:middle;
}
.status{
  margin:0;min-height:1.3em;text-align:center;
  font-size:clamp(20px,3.4vw,34px);font-weight:900;color:transparent;
}
.status.ok{color:var(--ok)}
.status.no{color:var(--soft)}
.letterCard.bad,.wordCard.bad,.textCard.bad{animation:shake .34s ease}

.kbDock{
  flex:none;width:min(980px,calc(100% - 12px));
  margin:0 auto;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  border-radius:26px 26px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.72),#ffd6ee 70%,#e4dcff);
  box-shadow:0 -5px 0 rgba(255,150,196,.35);
}
.kbLegend{
  margin:0 0 6px;text-align:center;
  font-size:clamp(12px,1.7vw,16px);font-weight:800;color:#6a3d86;
}
.kb{width:100%;display:flex;flex-direction:column;gap:7px}
.kbRow{display:flex;justify-content:center;gap:6px}
.kbRow.inset{padding:0 4.5%}
.key{
  flex:1 1 0;min-width:0;
  height:clamp(46px,7.2vh,62px);
  border-radius:14px;
  background:linear-gradient(#fff,#fff7fb);
  box-shadow:0 4px 0 #e7b6d4;
  color:#5a3478;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1;
}
.key .main{font-size:clamp(18px,3.2vw,30px)}
.key .sub{font-size:clamp(10px,1.5vw,13px);font-weight:900}
.key.wide{flex:1.45 1 0}
.key.space{
  flex:7 1 auto;
  background:linear-gradient(#fff,#f3fff8);
  box-shadow:0 4px 0 #7dceb0;
}
.key.space .main{font-family:inherit;font-size:clamp(16px,2.4vw,22px);font-weight:900}
.key.shift{background:linear-gradient(#fff4b0,#ffc94a);box-shadow:0 4px 0 #e0a020;color:#6a4200}
.key.shift.on{background:linear-gradient(#ffe56a,#ffb703);outline:3px solid #fff}
.key.shift.lock{background:linear-gradient(#ffe08a,#ff9f1c);outline:3px solid #fff;box-shadow:inset 0 0 0 3px #fff,0 4px 0 #e08a00}
.key.del{background:linear-gradient(#ffe0ea,#ff9eb6);box-shadow:0 4px 0 #e07a98}
.key.fn{background:linear-gradient(#e5f3ff,#8fd0ff);box-shadow:0 4px 0 #5aa8e0;color:#0d4e86}
.key.hot{outline:3px solid #ff4d8d;animation:wiggle .7s ease-in-out infinite}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #e7b6d4}
.key.good{background:#d9f8e4;box-shadow:0 4px 0 #7dceb0}
.key.bad{background:#ffe1d2;box-shadow:0 4px 0 #ffb088}
.kb.locked{pointer-events:none;opacity:.72}

/* ---------- result ---------- */
#result{
  position:fixed;inset:0;z-index:5;
  display:none;align-items:center;justify-content:center;
  padding:20px;
  background:rgba(255,244,250,.94);
}
#result.on{display:flex}
.resultCard{
  width:min(560px,100%);
  text-align:center;
  padding:22px 18px 20px;
  border-radius:36px;background:#fff;
  border:6px solid transparent;
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(135deg,#ff8ec8,#ffd15c,#7ddeb3,#7ecbff) border-box;
  box-shadow:0 10px 0 #f3c3dc;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.resultMark{font-size:clamp(40px,8vw,64px);line-height:1}
.resultStars{font-size:clamp(42px,8vw,72px);letter-spacing:.08em;line-height:1}
.resultTitle{margin:0;font-size:clamp(28px,5vw,44px);font-weight:900}
.resultWhy,.resultNums{margin:0;font-weight:900;font-size:clamp(16px,2.6vw,24px);line-height:1.4}
.resultWhy{color:#0e6f8a}
.resultActions{
  width:100%;
  margin-top:6px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.bigbtn{
  width:min(100%,280px);min-height:68px;padding:0 28px;
  border-radius:999px;background:#ff5fa2;color:#fff;
  font-size:clamp(22px,3.5vw,32px);font-weight:900;
  box-shadow:0 6px 0 #d43b7c;
}
.bigbtn.alt{
  background:#fff;color:var(--deep);
  border:3px solid #ff8ec8;
  box-shadow:0 6px 0 #f3c3dc;
}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d43b7c}
.bigbtn.alt:active{box-shadow:0 2px 0 #f3c3dc}
@media (min-width:560px){
  .resultActions{flex-direction:row;justify-content:center}
}

@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes wiggle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){
  .glyph.pop,.lvl.just,.letterCard.bad,.wordCard.bad,.textCard.bad,.key.hot{animation:none}
  .bar>span{transition:none}
}
@media (max-width:860px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}
  .mascot{width:48px;height:48px}
}
@media (max-height:760px){
  .homeTop{margin-top:4px;padding:6px 8px}
  h1{font-size:clamp(22px,4vw,32px)}
  .letterCard{min-height:96px}
  .glyph{font-size:clamp(72px,16vmin,140px)}
  .key{height:44px;border-radius:12px}
}
</style>
</head>
<body>
<p id="live" class="sr-only" aria-live="polite"></p>
<p id="booterr" hidden></p>

<section id="home" class="screen on" aria-label="關卡主頁">
  <div class="homeTop">
    <div class="brand">
      <img class="mascot" src="../assets/mascot.jpg" alt="Q版白色小狗" width="64" height="64">
      <div>
        <h1>🌟 英文字母打字 🌟</h1>
        <p class="brandSub">100 關 · 字母玩到短文</p>
      </div>
    </div>
    <div class="statRow">
      <div class="totalPill" id="totalPill">⭐ 0 / 300</div>
      <label class="soundToggle"><input type="checkbox" id="optSound" checked> 音效</label>
    </div>
    <p class="banner" id="banner" hidden></p>
    <div class="jumps" id="jumps" role="navigation" aria-label="跳去某一頁關卡"></div>
  </div>
  <div id="scroller" tabindex="-1"></div>
  <p class="footNote"><a class="backsite" href="../">返遊戲站</a> · 唔使登入 · 重新整理會清走星星</p>
</section>

<section id="play" class="screen" aria-label="打字">
  <div class="topbar">
    <button type="button" class="iconbtn" id="btnHome" aria-label="返主頁">🏠</button>
    <button type="button" class="iconbtn" id="btnSound" aria-pressed="true" aria-label="音效開住，撳一下閂">🔊</button>
    <span class="pill lv" id="lvPill">第 1 關</span>
    <span class="pill phase" id="phasePill">🐣 小楷</span>
    <span class="pill prog" id="progPill">1 / 9</span>
    <span class="pill miss" id="missPill">打錯 0</span>
    <span class="spacer"></span>
    <span class="pill live" id="liveStarPill">預計 ★★★</span>
  </div>
  <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
  <div class="stage">
    <div class="hints" id="hints"></div>
    <div class="letterCard" id="viewLetter">
      <p class="ask">打呢個字母</p>
      <div class="glyph letters" id="glyph" lang="en">a</div>
    </div>
    <div class="wordCard" id="viewWord" hidden>
      <p class="ask" id="wordAsk">打呢個詞</p>
      <div class="wordShow letters" id="wordShow" lang="en"></div>
      <div class="slots" id="slots"></div>
    </div>
    <div class="textCard" id="viewText" hidden>
      <p class="ask" id="textAsk">打呢段</p>
      <p class="passage letters" id="passage" lang="en"></p>
    </div>
    <p class="coach" id="coach" aria-live="polite"></p>
    <p class="status" id="status"></p>
  </div>

    if(!Object.prototype.hasOwnProperty.call(FIRST_SPECIAL, ch)) FIRST_SPECIAL[ch] = index + 1;
  }
});

function shuffle(list){
  var arr = list.slice();
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }
  return arr;
}

function isUpper(ch){
  return /^[A-Z]$/.test(ch);
}

function phaseOf(id){
  if(id <= 20) return {key:"lower", label:"小楷", emoji:"🐣"};
  if(id <= 30) return {key:"upper", label:"大楷", emoji:"🦁"};
  if(id <= 39) return {key:"mix", label:"混合", emoji:"🌈"};
  if(id <= 70) return {key:"word", label:"詞語", emoji:"🐱"};
  if(id <= 80) return {key:"sent", label:"短句", emoji:"💬"};
  return {key:"para", label:"短文", emoji:"📖"};
}

function flagsFromSpec(spec){
  var blob = "";
  if(spec.words) blob = spec.words.join(" ");
  else if(spec.text) blob = spec.text;
  else blob = spec.letters || "";
  var needsUpper = spec.kase === "upper" || spec.kase === "both" || spec.kase === "mix" || /[A-Z]/.test(blob);
  var hasSpace = (spec.words || []).some(function(w){return w.indexOf(" ") >= 0;}) || (spec.text ? spec.text.indexOf(" ") >= 0 : false);
  var hasSymbol = /[^A-Za-z\s]/.test(blob);
  return {needsUpper:needsUpper, hasSpace:hasSpace, hasSymbol:hasSymbol};
}

function taskCount(spec){
  if(spec.kind === "each"){
    var n = spec.letters.length * spec.times * (spec.kase === "both" ? 2 : 1);
    return n + " 個字母";
  }
  if(spec.kind === "sample") return spec.n + " 個字母";
  if(spec.kind === "words") return spec.words.length + " 個詞";
  return spec.text.length + " 個字";
}

function eachLetters(letters, times, kase){
  var out = [];
  for(var i = 0; i < letters.length; i++){
    var base = letters.charAt(i);
    var forms = kase === "both" ? [base.toUpperCase(), base.toLowerCase()]
      : kase === "upper" ? [base.toUpperCase()] : [base.toLowerCase()];
    for(var f = 0; f < forms.length; f++){
      for(var t = 0; t < times; t++) out.push(forms[f]);
    }
  }
  return shuffle(out);
}

function sampleFrom(letters, n, kase){
  var pool = letters.split("");
  var out = [];
  var last = "";
  for(var i = 0; i < n; i++){
    var choices = [];
    for(var j = 0; j < pool.length; j++){
      if(pool[j].toLowerCase() !== last.toLowerCase()) choices.push(pool[j]);
    }
    if(!choices.length) choices = pool.slice();
    var base = choices[Math.floor(Math.random() * choices.length)];
    var ch = base.toLowerCase();
    if(kase === "upper") ch = ch.toUpperCase();
    else if(kase === "mix") ch = Math.random() < 0.5 ? ch.toUpperCase() : ch;
    out.push(ch);
    last = ch;
  }
  if(kase === "mix" && n >= 2){
    var hasU = out.some(function(c){return isUpper(c);});
    var hasL = out.some(function(c){return /^[a-z]$/.test(c);});
    if(!hasU) out[0] = out[0].toUpperCase();
    if(!hasL) out[1] = out[1].toLowerCase();
  }
  return out;
}

function expand(spec){
  if(spec.kind === "each") return {kind:"letters", prompts:eachLetters(spec.letters, spec.times, spec.kase)};
  if(spec.kind === "sample") return {kind:"letters", prompts:sampleFrom(spec.letters, spec.n, spec.kase)};
  if(spec.kind === "words") return {kind:"words", prompts:spec.words.slice()};
  return {kind:"text", prompts:[spec.text]};
}

function calcStars(mistakes){
  if(mistakes <= 0) return 3;
  if(mistakes <= 2) return 2;
  return 1;
}

function explainStars(stars, mistakes){
  if(stars === 3) return "一次都冇打錯，三粒星。";
  if(mistakes <= 2) return "打錯 " + mistakes + " 次，所以兩粒星。";
  return "打錯 " + mistakes + " 次，做完都有一粒星。";
}

function selfCheck(){
  var issues = [];
  if(LEVELS.length !== 100) issues.push("關卡數量 " + LEVELS.length);
  LEVELS.forEach(function(lv, i){
    if(lv.id !== i + 1) issues.push("id " + lv.id);
    if(!lv.preview) issues.push("preview " + lv.id);
  });
  var l1 = expand(LEVELS[0].spec);
  var counts = {a:0, b:0, c:0};
  l1.prompts.forEach(function(p){counts[p] = (counts[p] || 0) + 1;});
  if(l1.kind !== "letters" || counts.a !== 3 || counts.b !== 3 || counts.c !== 3) issues.push("第1關");
  var l21 = expand(LEVELS[20].spec);
  if(l21.prompts.some(function(p){return p !== p.toUpperCase();})) issues.push("第21關");
  var l40 = expand(LEVELS[39].spec);
  if(l40.kind !== "words" || l40.prompts.join(",") !== "cat,dog,pig") issues.push("第40關");
  var l71 = expand(LEVELS[70].spec);
  if(l71.kind !== "text" || l71.prompts[0] !== "I see a cat.") issues.push("第71關");
  var l100 = expand(LEVELS[99].spec);
  if(l100.kind !== "text" || l100.prompts[0].indexOf("happy") < 0) issues.push("第100關");
  if(calcStars(0) !== 3) issues.push("三星");
  if(calcStars(1) !== 2 || calcStars(2) !== 2) issues.push("兩星");
  if(calcStars(3) !== 1) issues.push("一星");
  if(FIRST_SPECIAL[" "] !== 63) issues.push("空格介紹關 " + FIRST_SPECIAL[" "]);
  if(FIRST_SPECIAL["."] !== 71) issues.push("句號介紹關 " + FIRST_SPECIAL["."]);
  if(FIRST_SPECIAL["1"] !== 91) issues.push("數字1介紹關 " + FIRST_SPECIAL["1"]);
  if(FIRST_SPECIAL["2"] !== 92) issues.push("數字2介紹關 " + FIRST_SPECIAL["2"]);
  Object.keys(FIRST_SPECIAL).forEach(function(ch){
    if(ch !== " " && ch !== "." && ch !== "1" && ch !== "2") issues.push("未預計符號 " + ch);
  });
  var el = $("booterr");
  if(issues.length){
    el.hidden = false;
    el.textContent = "課程資料有問題：" + issues.join("、");
  }
  return issues;
}

function clearTimers(){
  timers.forEach(function(id){clearTimeout(id);});
  timers = [];
  if(tick){clearInterval(tick); tick = 0;}
}

function later(fn, ms){
  var id = setTimeout(fn, ms);
  timers.push(id);
  return id;
}

function ensureAudio(){
  if(!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{audioCtx = new AC();}catch(e){return null;}
  }
  if(audioCtx.state === "suspended") audioCtx.resume().catch(function(){});
  return audioCtx;
}

function beep(freq, dur, type, vol){
  if(!store.sound) return;
  var ctx = ensureAudio();
  if(!ctx) return;
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  var v = vol || 0.08;
  g.gain.setValueAtTime(v, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(ctx.currentTime);
  o.stop(ctx.currentTime + dur + 0.02);
}

function sfxTick(){beep(660, 0.06, "sine", 0.05);}

function sfxWin(){

function currentPrompt(){
  return run.prompts[run.promptIndex] || "";
}

function currentChar(){
  var p = currentPrompt();
  return p.charAt(run.charIndex);
}

function doneChars(){
  var n = 0;
  for(var i = 0; i < run.promptIndex; i++) n += run.prompts[i].length;
  return n + run.charIndex;
}

function totalChars(){
  var n = 0;
  for(var i = 0; i < run.prompts.length; i++) n += run.prompts[i].length;
  return n;
}

function layoutHas(name, ch){
  var rows = LAYOUTS[name];
  for(var r = 0; r < rows.length; r++){
    if(rows[r].indexOf(ch) >= 0) return true;
    if(ch === " " && rows[r].indexOf("space") >= 0) return true;
    if(/^[A-Z]$/.test(ch) && rows[r].indexOf(ch.toLowerCase()) >= 0) return true;
  }
  return false;
}

function whereIs(ch){
  if(/^[a-zA-Z]$/.test(ch) || ch === " ") return "letters";
  if(NUM_CHARS.indexOf(ch) >= 0) return "numbers";
  return "symbols";
}

function isLetterKey(ch){
  return /^[A-Za-z]$/.test(ch);
}

function hintCurrent(){
  if(!run || !run.level) return false;
  var ch = currentChar();
  if(!ch) return false;
  if(run.level.id <= 10) return true;
  if(isLetterKey(ch)) return false;
  return FIRST_SPECIAL[ch] === run.level.id;
}

function setCoach(){
  $("coach").textContent = hintCurrent() ? coachLine(currentChar()) : "";
}

function coachLine(ch){
  if(!ch) return "";
  if(ch === " ") return "而家要撳下面長長嘅空格鍵";
  if(isUpper(ch)){
    if(shiftMode === 0) return "而家要大楷 " + ch + "：先撳黃色 ⇧（向上），再撳字母";
    if(shiftMode === 2) return "大楷鎖住咗，撳字母 " + ch;
    return "⇧ 開咗，而家撳大楷 " + ch;
  }
  if(/^[a-z]$/.test(ch)){
    if(shiftMode === 2) return "要小楷 " + ch + "：撳 ⇧ 解除大楷鎖";
    if(shiftMode === 1) return "要小楷 " + ch + "：再撳一下 ⇧，取消大楷";
    return "而家撳小楷 " + ch;
  }
  var here = layoutHas(layoutName, ch) && layoutName !== "letters";
  if(/^[0-9]$/.test(ch)){
    return here ? "而家撳數字 " + ch : "而家要數字 " + ch + "：先撳藍色 123";
  }
  if(layoutName === "letters") return "而家要符號 " + ch + "：先撳藍色 123";
  if(!layoutHas(layoutName, ch)) return "呢個符號喺另一版：撳 #+= 或者 123";
  return "而家撳符號 " + ch;
}

function levelHasNewSymbol(level){
  var blob = specSource(level.spec);
  for(var i = 0; i < blob.length; i++){
    var ch = blob.charAt(i);
    if(ch === " " || isLetterKey(ch)) continue;
    if(FIRST_SPECIAL[ch] === level.id) return true;
  }
  return false;
}

function levelHintLines(level){
  var lines = [];
  var teachSpace = level.id <= 10 ? level.hasSpace : FIRST_SPECIAL[" "] === level.id;
  var teachSymbol = level.id <= 10 ? level.hasSymbol : levelHasNewSymbol(level);
  if(level.needsUpper){
    lines.push("要打大楷：先撳黃色 ⇧（向上），再撳字母。撳一下，下一個字母先係大楷；快啲撳兩下 ⇧，就可以鎖住大楷。");
  }
  if(teachSpace){
    lines.push("要打空格：字同字之間，撳鍵盤下面長長嘅空格鍵。");
  }
  if(teachSymbol){
    lines.push("句號、問號同數字：先撳 123。想睇多啲符號，再撳 #+=。");
  }
  return lines;
}

function hotSet(){
  var hot = {};
  var ch = currentChar();
  if(!hintCurrent() || !ch || !run) return hot;
  if(ch === " "){hot.space = true; return hot;}
  if(/^[a-zA-Z]$/.test(ch)){
    if(layoutName === "letters") hot[ch.toLowerCase()] = true;
    else hot.abc = true;
    if(isUpper(ch) && shiftMode === 0) hot.shift = true;
    if(!isUpper(ch) && shiftMode > 0) hot.shift = true;
    return hot;
  }
  var home = whereIs(ch);
  if(layoutHas(layoutName, ch) && layoutName === home) hot[ch] = true;
  else if(layoutName === "letters") hot.num = true;
  else if(home === "symbols" && layoutName === "numbers") hot.sym = true;
  else if(home === "numbers" && layoutName === "symbols") hot.num = true;
  else hot.num = true;
  return hot;
}

function keyLabel(token){
  if(token === "shift") return shiftMode === 2 ? "⇪" : "⇧";
  if(token === "del") return "⌫";
  if(token === "num") return "123";
  if(token === "sym") return "#+=";
  if(token === "abc") return "ABC";
  if(token === "space") return "空格";
  if(/^[a-z]$/.test(token) && shiftMode > 0) return token.toUpperCase();
  return token;
}

function keyOutput(token){
  if(token === "space") return " ";
  if(/^[a-z]$/.test(token)) return shiftMode > 0 ? token.toUpperCase() : token;
  if(token.length === 1) return token;
  return null;
}

function ariaFor(token){
  if(token === "shift") return "大楷。撳一下準備下一個大楷，快撳兩下鎖住大楷";
  if(token === "del") return "刪除上一個已經打啱嘅字";
  if(token === "num") return "數字同符號";
  if(token === "sym") return "更多符號";
  if(token === "abc") return "返字母鍵盤";
  if(token === "space") return "空格";
  var label = keyLabel(token);
  if(isUpper(label)) return "大楷 " + label;
  if(/^[a-z]$/.test(label)) return "小楷 " + label;
  return label;
}

function renderKeyboard(){
  var kb = $("kb");
  var rows = LAYOUTS[layoutName];
  var hot = hotSet();
  kb.innerHTML = "";
  rows.forEach(function(row, idx){
    var line = document.createElement("div");
    line.className = "kbRow" + (layoutName === "letters" && idx === 1 ? " inset" : "");
    row.forEach(function(token){
      var btn = document.createElement("button");
      btn.type = "button";
      var cls = "key";
      if(token === "shift" || token === "del" || token === "num" || token === "sym" || token === "abc") cls += " wide";
      if(token === "shift") cls += " shift" + (shiftMode === 1 ? " on" : shiftMode === 2 ? " lock" : "");
      if(token === "del") cls += " del";
      if(token === "num" || token === "sym" || token === "abc") cls += " fn";
      if(token === "space") cls += " space";
      if(/^[a-z]$/.test(token) || (token.length === 1 && /[A-Za-z]/.test(keyLabel(token)))) cls += " letters";
      if(hot[token]) cls += " hot";
      btn.className = cls;
      btn.setAttribute("data-key", token);
      btn.setAttribute("aria-label", ariaFor(token));
      if(token === "shift") btn.setAttribute("aria-pressed", shiftMode > 0 ? "true" : "false");
      var main = document.createElement("span");
      main.className = "main";
      main.textContent = keyLabel(token);
      btn.appendChild(main);
      if(token === "shift"){
        var sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = shiftMode === 2 ? "鎖住" : "大楷";
        btn.appendChild(sub);
      }
      line.appendChild(btn);
    });
    kb.appendChild(line);
  });
  kb.classList.toggle("locked", locked);
}

function renderAll(){
  renderPrompt();
  renderScores();
  renderKeyboard();
}

function setStatus(msg, kind){
  var el = $("status");
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
  if(msg) $("live").textContent = msg;
}

function flashCard(cls){
  ["viewLetter","viewWord","viewText"].forEach(function(id){
    var el = $(id);
    el.classList.remove("bad");
    if(cls){
      void el.offsetWidth;
      el.classList.add(cls);
    }
  });
}

function flashKey(token, cls){
  var keys = $("kb").querySelectorAll(".key");
  for(var i = 0; i < keys.length; i++) keys[i].classList.remove("good","bad");
  if(!token) return;
  for(var k = 0; k < keys.length; k++){
    if(keys[k].getAttribute("data-key") === token){
      keys[k].classList.add(cls);
      return;
    }
  }
}

function tokenForChar(ch){
  if(ch === " ") return "space";
  if(/^[A-Z]$/.test(ch)) return ch.toLowerCase();
  return ch;
}

function missMessage(got, want){
  if(want === " ") return "要撳空格鍵呀";
  if(/^[a-z]$/.test(want) && got === want.toUpperCase()) return "要小楷呀";
  if(isUpper(want) && got.toLowerCase() === want.toLowerCase()) return "要大楷呀，先撳 ⇧";
  if(/^[0-9]$/.test(want)) return "先撳 123，再撳數字 " + want;
  if(!/^[a-zA-Z ]$/.test(want)) return "先撳 123，再搵 " + want;
  return "再試下";
}

function speakPrompt(){
  var ch = currentChar();
  var say = ch === " " ? "空格" : ch;
  if(run.kind === "letters") $("live").textContent = "第 " + run.level.id + " 關，打 " + say;
  else if(run.kind === "words") $("live").textContent = "打個詞 " + currentPrompt() + "，而家 " + say;
  else $("live").textContent = "打短文，而家 " + say;
}

function advancePrompt(){
  run.promptIndex += 1;
  run.charIndex = 0;
  if(run.promptIndex >= run.prompts.length){
    finishLevel();
    return;
  }
  setStatus(PRAISE[praiseI++ % PRAISE.length], "ok");
  sfxOk();
  if(run.kind === "text"){
    renderAll();
    speakPrompt();
    return;
  }
  locked = true;
  renderAll();
  later(function(){
    locked = false;
    setStatus("", "");
    renderAll();
    speakPrompt();
  }, run.kind === "letters" ? 520 : 640);
}

function onHit(ch){
  if(shiftMode === 1 && /^[A-Za-z]$/.test(ch)) shiftMode = 0;
  run.charIndex += 1;
  flashCard("");
  flashKey(tokenForChar(ch), "good");
  var prompt = currentPrompt();
  if(run.charIndex >= prompt.length){
    advancePrompt();
    return;
  }
  if(run.kind === "letters") sfxOk();
  else sfxTick();
  setStatus("", "");
  renderAll();
  speakPrompt();
}

function onMiss(got, want){
  run.mistakes += 1;
  flashCard("bad");
  flashKey(tokenForChar(got), "bad");
  var msg = missMessage(got, want);
  setStatus(msg, "no");
  sfxNo();
  renderScores();
  renderKeyboard();
}

function submitChar(ch){
  if(screenName !== "play" || !run || locked || run.over) return;
  if(typeof ch !== "string" || ch.length !== 1) return;
  var want = currentChar();
  if(!want) return;
  if(ch === want) onHit(ch);
  else onMiss(ch, want);
}

function doBackspace(){
  if(screenName !== "play" || !run || locked || run.over) return;
  if(run.charIndex <= 0) return;
  run.charIndex -= 1;
  setStatus("", "");
  renderAll();
}

function onShift(){
  var now = Date.now();
  if(shiftMode === 2) shiftMode = 0;
  else if(shiftMode === 1 && now - lastShiftAt < 420) shiftMode = 2;
  else if(shiftMode === 1) shiftMode = 0;
  else shiftMode = 1;
  lastShiftAt = now;
  renderKeyboard();
  setCoach();
}

function onKeyToken(token){
  if(token === "shift"){onShift(); return;}
  if(token === "del"){doBackspace(); return;}
  if(token === "num"){layoutName = "numbers"; renderKeyboard(); setCoach(); return;}
  if(token === "sym"){layoutName = "symbols"; renderKeyboard(); setCoach(); return;}
  if(token === "abc"){layoutName = "letters"; renderKeyboard(); setCoach(); return;}
  var out = keyOutput(token);
  if(out) submitChar(out);
}

function finishLevel(){
  if(run.over) return;
  run.over = true;
  locked = true;
  clearTimers();
  var stars = calcStars(run.mistakes);
  var prev = bestOf(run.level.id);
  var best = Math.max(prev, stars);
  if(stars > prev) store.stars[String(run.level.id)] = stars;
  banner = {id:run.level.id, stars:stars, best:best};
  $("resultMark").textContent = stars === 3 ? "🎉" : stars === 2 ? "👏" : "💪";
  $("resultStars").innerHTML = starsHtml(stars);
  $("resultTitle").textContent = "第 " + run.level.id + " 關完成！";
  $("resultWhy").textContent = explainStars(stars, run.mistakes);
  var extra = stars > prev ? "新高分！主頁會見到 " + stars + " 粒星。"
    : prev > stars ? "今次 " + stars + " 粒星，主頁保持最佳 " + prev + " 粒星。"
    : "主頁最佳仍然係 " + best + " 粒星。";
  $("resultNums").textContent = "打錯 " + run.mistakes + " 次。" + extra;
  $("result").classList.add("on");
  $("live").textContent = "第 " + run.level.id + " 關完成，拿到 " + stars + " 粒星。" + extra;
  sfxWin();
  var nextBtn = $("btnResultNext");
  var hasNext = run.level.id < LEVELS.length;
  nextBtn.hidden = !hasNext;
  nextBtn.disabled = !hasNext;
  $("btnResultHome").textContent = "返主頁睇星星";
  (hasNext ? nextBtn : $("btnResultHome")).focus();
}

function goHome(focusId){
  clearTimers();
  locked = false;
  $("result").classList.remove("on");
  show("home");
  renderHome(focusId || 0);
  if(focusId){
    requestAnimationFrame(function(){
      var pageNo = Math.ceil(focusId / 10);
      var page = $("page-" + pageNo);
      if(page) scrollPage(page, false);
      document.querySelectorAll(".jump").forEach(function(btn){
        btn.classList.toggle("on", btn.getAttribute("data-page") === String(pageNo));
      });
    });
  }
}

function startLevel(id){
  var level = LEVELS[id - 1];
  if(!level) return;
  clearTimers();
  var expanded = expand(level.spec);
  run = {
    level:level,
    kind:expanded.kind,
    prompts:expanded.prompts,
    promptIndex:0,
    charIndex:0,
    mistakes:0,
    over:false
  };
  locked = false;
  shiftMode = 0;
  lastShiftAt = 0;
  layoutName = "letters";
  praiseI = 0;
  banner = null;
  $("result").classList.remove("on");
  setStatus("", "");
  flashCard("");
  show("play");
  renderHints();
  renderAll();
  speakPrompt();
}

var pageWatchOn = false;
function markVisiblePage(){
  var scroller = $("scroller");
  var pages = scroller.querySelectorAll(".page");
  if(!pages.length) return;
  var edge = scroller.getBoundingClientRect().top;
  var best = pages[0];
  var bestDist = Infinity;
  for(var i = 0; i < pages.length; i++){
    var dist = Math.abs(pages[i].getBoundingClientRect().top - edge);
    if(dist < bestDist){bestDist = dist; best = pages[i];}
  }
  var page = best.getAttribute("data-page");
  document.querySelectorAll(".jump").forEach(function(btn){
    btn.classList.toggle("on", btn.getAttribute("data-page") === page);
    btn.setAttribute("aria-current", btn.getAttribute("data-page") === page ? "true" : "false");
  });
}
function watchPage(){
  if(pageWatchOn) return;
  pageWatchOn = true;
  $("scroller").addEventListener("scroll", markVisiblePage, {passive:true});
  markVisiblePage();
}

loadStore();
var bootIssues = selfCheck();
renderJumps();
renderHome(0);
syncSound();
show("home");
fitPages();
watchPage();
window.addEventListener("resize", fitPages);

$("jumps").addEventListener("click", function(e){
  var btn = e.target.closest("[data-page]");
  if(!btn) return;
  var page = $("page-" + btn.getAttribute("data-page"));
    if(page) scrollPage(page, true);
});

$("scroller").addEventListener("click", function(e){
  var btn = e.target.closest("[data-level]");
  if(!btn) return;
  ensureAudio();
  startLevel(Number(btn.getAttribute("data-level")));
});

$("optSound").addEventListener("change", function(){
  store.sound = $("optSound").checked;
  if(store.sound) ensureAudio();
  saveStore();
  syncSound();
});

$("btnSound").addEventListener("click", function(){
  store.sound = !store.sound;
  if(store.sound) ensureAudio();
  saveStore();
  syncSound();
});

$("btnHome").addEventListener("click", function(){goHome(0);});
$("btnResultNext").addEventListener("click", function(){
  if(!run || run.level.id >= LEVELS.length) return;
  startLevel(run.level.id + 1);
});
$("btnResultHome").addEventListener("click", function(){
  goHome(run ? run.level.id : 0);
});

$("kb").addEventListener("click", function(e){
  var btn = e.target.closest("[data-key]");
  if(!btn) return;
  onKeyToken(btn.getAttribute("data-key"));
  btn.blur();
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(screenName === "play" || $("result").classList.contains("on")){
      e.preventDefault();
      goHome(run && run.over ? run.level.id : 0);
    }
    return;
  }
  if($("result").classList.contains("on")){
    if(e.key === "Enter"){
      e.preventDefault();
      var nextBtn = $("btnResultNext");
      if(run && nextBtn && !nextBtn.hidden && run.level.id < LEVELS.length) startLevel(run.level.id + 1);
      else goHome(run ? run.level.id : 0);
    }
    return;
  }
  if(screenName !== "play" || !run) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === "Backspace"){
    e.preventDefault();
    doBackspace();
    return;
  }
  if(e.key === "Shift" || e.key === "CapsLock" || e.key === "Tab") return;
  if(e.repeat) return;
  if(e.key.length !== 1) return;
  e.preventDefault();
  submitChar(e.key);
});

document.addEventListener("contextmenu", function(e){
  if(e.target.closest && e.target.closest("button")) e.preventDefault();
});

if(bootIssues.length) console.error(bootIssues);
})();
</script>
</body>
</html>
