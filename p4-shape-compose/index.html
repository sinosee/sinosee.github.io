<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffe4f4">
<title>圖形分割和拼砌</title>
<style>
:root{
  --ink:#5a2d78;
  --muted:#7a568f;
  --deep:#c43b86;
  --gold:#f5a623;
  --ok:#1a9a52;
  --soft:#e36a2c;
  --empty:#eadcf2;
  --shadow:#f3c3dc;
  --pink:#ff8ec8;
  --pink-2:#ffb3de;
  --pink-3:#ffd6ea;
  --yellow:#ffd15c;
  --yellow-2:#ffe29a;
  --green:#7ddeb3;
  --green-2:#b8f3d8;
  --blue:#7ecbff;
  --blue-2:#c9dcff;
  --purple:#c9b6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100dvh;
  color:var(--ink);
  background:
    radial-gradient(circle at 6% 8%,#ffe29a 0,transparent 26%),
    radial-gradient(circle at 96% 0,#ffb3de 0,transparent 30%),
    radial-gradient(circle at 90% 92%,#b8f3d8 0,transparent 28%),
    radial-gradient(circle at 4% 96%,#c9dcff 0,transparent 26%),
    linear-gradient(165deg,#fff0f8 0%,#e7f7ff 42%,#fff6d8 100%);
  font-family:"PingFang HK","PingFang TC","Noto Sans CJK HK","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:18px;
  line-height:1.45;
}
button,a{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.wrap{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:18px 0 36px}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-bottom:14px;
}
.back{
  display:inline-flex;align-items:center;min-height:48px;padding:0 16px;
  border-radius:999px;background:#fff;border:3px solid var(--pink);
  box-shadow:0 4px 0 var(--shadow);
  color:var(--ink);font-weight:900;font-size:18px;text-decoration:none;
}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
h1{margin:0;font-size:clamp(32px,5vw,46px);letter-spacing:.04em;line-height:1.2;font-weight:900;color:var(--ink)}
.sub{margin:6px 0 0;color:var(--muted);font-weight:700;font-size:clamp(16px,2.2vw,20px)}
.modes{display:flex;gap:12px;margin:18px 0}
.mode{
  flex:1;text-align:left;background:#fff;border:4px solid var(--blue);border-radius:24px;
  box-shadow:0 6px 0 var(--blue);
  padding:14px 16px;min-height:92px;
}
.mode[data-mode="teacher"]{border-color:var(--pink);box-shadow:0 6px 0 var(--pink)}
.mode.sel{background:#fff0f8}
.mode[data-mode="student"].sel{background:#e7f7ff}
.mode[data-mode="teacher"].sel{background:#ffe3f2}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue)}
.mode[data-mode="teacher"]:active{box-shadow:0 2px 0 var(--pink)}
.mode b{display:block;font-size:clamp(22px,3vw,28px);margin-bottom:4px}
.mode span{color:var(--muted);font-weight:700;font-size:16px}
.lessons{display:grid;gap:14px}
@media(min-width:800px){.lessons{grid-template-columns:1fr 1fr}}
.lesson{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  min-height:148px;padding:22px 20px;border-radius:28px;text-align:left;
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(100deg,#ff8ec8,#ffd15c,#7ddeb3,#7ecbff,#c9b6ff) border-box;
  border:5px solid transparent;
  box-shadow:0 6px 0 var(--shadow);
}
.lesson:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.lesson b{font-size:clamp(28px,4vw,36px)}
.lesson span{color:var(--muted);font-weight:700;font-size:18px}
.note{
  margin:16px 0 0;padding:14px 16px;background:#fff7cc;border-radius:18px;
  border:3px solid var(--yellow);box-shadow:0 4px 0 #ffe29a;
  color:var(--ink);font-weight:800;
}
.foot{
  display:flex;align-items:center;gap:16px;margin-top:18px;padding:14px;
  border-radius:28px;
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(100deg,#ff8ec8,#ffd15c,#7ddeb3,#7ecbff,#c9b6ff) border-box;
  border:5px solid transparent;
  box-shadow:0 6px 0 var(--shadow);
}
.foot img.qr{width:112px;height:auto;border-radius:12px;background:#fff}
.foot .dog{
  width:52px;height:52px;border-radius:50%;object-fit:cover;
  border:3px solid var(--pink);box-shadow:0 3px 0 #ffc2de;background:#ffd6ea;
}
.foot p{margin:0 0 4px;font-weight:900}
.foot a{color:var(--deep);font-weight:900;word-break:break-all}
.group{
  display:inline-block;margin:18px 0 8px;padding:4px 12px;
  font-size:18px;font-weight:900;color:var(--ink);
  background:#ffe3f2;border:3px solid var(--pink);border-radius:999px;
}
.tasklist{display:grid;gap:10px;margin-bottom:6px}
.taskbtn{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;min-height:72px;padding:12px 16px;border-radius:20px;
  background:#fff;border:4px solid var(--pink);text-align:left;
  box-shadow:0 5px 0 var(--pink);
}
.taskbtn:nth-child(6n+2){border-color:var(--gold);box-shadow:0 5px 0 var(--gold)}
.taskbtn:nth-child(6n+3){border-color:var(--yellow);box-shadow:0 5px 0 #e0b43a}
.taskbtn:nth-child(6n+4){border-color:var(--green);box-shadow:0 5px 0 #3dbe7a}
.taskbtn:nth-child(6n+5){border-color:var(--blue);box-shadow:0 5px 0 #4dabf7}
.taskbtn:nth-child(6n+6){border-color:var(--purple);box-shadow:0 5px 0 #8e7dff}
.taskbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink)}
.taskbtn b{display:block;font-size:clamp(18px,2.4vw,22px)}
.taskbtn small{display:block;color:var(--muted);font-weight:700;margin-top:2px}
.stageHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;
  background:#fff6d0;border:3px solid var(--yellow);
  font-weight:900;font-size:16px;color:var(--ink);
  box-shadow:0 3px 0 #ffe29a;
}
#btn-pause{background:#fff0f6;border-color:var(--pink);box-shadow:0 3px 0 var(--pink-2)}
.pill.on{background:#efe4ff;border-color:var(--purple);box-shadow:0 3px 0 var(--purple);color:var(--ink)}
.pill:active{transform:translateY(2px)}
.prompt{
  margin:12px 0;padding:14px 16px;background:#fff;border-radius:22px;
  border:4px solid var(--pink);box-shadow:0 5px 0 var(--shadow);
  font-size:clamp(20px,2.7vw,28px);font-weight:800;line-height:1.45;
}
.boardCard{
  margin-top:12px;padding:8px;border-radius:28px;touch-action:none;
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(100deg,#ff8ec8,#ffd15c,#7ddeb3,#7ecbff,#c9b6ff) border-box;
  border:5px solid transparent;
  box-shadow:0 6px 0 var(--shadow);
}
#board{width:100%;height:auto;max-height:58vh;display:block;touch-action:none;user-select:none;border-radius:18px}
#board text{font-family:"PingFang HK","PingFang TC","Noto Sans CJK HK","Microsoft JhengHei",sans-serif}
#board [data-pid]{cursor:grab}
#board .dot{cursor:crosshair}
.tools{
  position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:8px;
  padding:10px 0 6px;
  background:linear-gradient(180deg,rgba(255,240,248,0),rgba(255,240,248,.94) 32%);
}
.btn{
  min-height:54px;padding:0 18px;border-radius:18px;background:#fff;border:3px solid var(--pink-2);
  box-shadow:0 4px 0 var(--shadow);
  font-size:20px;font-weight:900;color:var(--ink);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
#btn-reset{background:#e7f4ff;border-color:var(--blue);box-shadow:0 4px 0 var(--blue)}
#btn-undo,#btn-edit{background:#fff7cc;border-color:var(--yellow);box-shadow:0 4px 0 #e0a020}
#btn-apart,#btn-rot{background:#e7fff4;border-color:var(--green);box-shadow:0 4px 0 #3dbe7a}
#btn-prev,#btn-next{background:#f6f0ff;border-color:var(--purple);box-shadow:0 4px 0 var(--purple)}
.btn.primary{background:#ff5fa2;color:#fff;border-color:#ff5fa2;box-shadow:0 5px 0 #d43b7c}
.btn.primary:active{box-shadow:0 2px 0 #d43b7c}
.btn:disabled{opacity:.45}
.feedback{
  min-height:52px;margin:8px 0 0;padding:12px 14px;border-radius:18px;
  font-size:clamp(18px,2.4vw,24px);font-weight:800;
  background:#fff7cc;border:3px solid var(--yellow);color:var(--ink);
  box-shadow:0 4px 0 #ffe29a;
}
.feedback.ok{background:#e5ffef;border-color:var(--green);color:var(--ok);box-shadow:0 4px 0 var(--green-2)}
.feedback.bad{background:#ffe8dc;border-color:#ff9a62;color:#c4471a;box-shadow:0 4px 0 #ffc49a}
.feedback.hint{background:#fff7cc;border-color:var(--yellow);color:var(--ink);box-shadow:0 4px 0 #ffe29a}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice{
  min-height:56px;padding:10px 14px;border-radius:18px;background:#fff;border:4px solid var(--blue-2);
  box-shadow:0 4px 0 var(--blue-2);
  text-align:left;font-size:clamp(18px,2.4vw,22px);font-weight:800;color:var(--ink);
}
.choice:nth-child(5n+1){border-color:var(--pink);box-shadow:0 4px 0 var(--pink-2)}
.choice:nth-child(5n+2){border-color:var(--yellow);box-shadow:0 4px 0 #ffe29a}
.choice:nth-child(5n+3){border-color:var(--green);box-shadow:0 4px 0 var(--green-2)}
.choice:nth-child(5n+4){border-color:var(--blue);box-shadow:0 4px 0 var(--blue-2)}
.choice:nth-child(5n+5){border-color:var(--purple);box-shadow:0 4px 0 #e4dcff}
.choice.sel{background:#fff0f8;border-color:var(--deep);box-shadow:0 4px 0 var(--shadow)}
.choice:active{transform:translateY(2px)}
.yn{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#fff;border:4px solid var(--pink-2);border-radius:18px;
  box-shadow:0 4px 0 var(--shadow);
  padding:8px 10px;margin-top:8px;
}
.yn b{min-width:7em;font-size:20px}
.yn button{
  min-height:48px;padding:0 14px;border-radius:14px;border:3px solid var(--pink);
  background:#fff;font-weight:900;font-size:18px;color:var(--ink);
  box-shadow:0 3px 0 var(--pink-2);
}
.yn button[data-val="yes"]{border-color:var(--green);box-shadow:0 3px 0 var(--green-2);background:#f3fff8}
.yn button[data-val="no"]{border-color:#ff9a62;box-shadow:0 3px 0 #ffc49a;background:#fff4ee}
.yn button.sel{background:#fff0f8;border-color:var(--deep);box-shadow:0 3px 0 var(--shadow)}
.yn.good{border-color:var(--green);background:#e5ffef}
.yn.nope{border-color:#ff9a62;background:#ffe8dc}
.pause{
  position:fixed;inset:0;background:rgba(255,244,250,.94);z-index:20;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;
}
.pause.on{display:flex}
.pause p{margin:0;font-size:clamp(40px,8vw,72px);font-weight:900;color:var(--deep)}
.navrow{display:flex;gap:8px;margin-top:8px}
.fine{color:var(--muted);font-weight:700;font-size:15px;margin:8px 0 0}
@media(max-width:640px){
  .wrap{width:min(1080px,calc(100% - 16px))}
  .mode{min-height:0;padding:10px 12px}
  .lesson{min-height:120px;padding:16px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="pause" id="pause"><p>暫停</p><button type="button" class="btn primary" id="btnResume">繼續</button></div>
<script src="geom.js"></script>
<script src="app.js"></script>
</body>
</html>
