<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>除法錯中找錯</title>
<style>
:root{
  --vh:100vh;
  --bg:#e8f4ff; --ink:#2a2a3a; --card:#ffffff;
  --orange:#ff8c1a; --green:#2fb35a; --blue:#3b82f6; --purple:#7c4dff;
  --pink:#ff6b9d; --red:#e53935; --teal:#14b8a6; --sky:#5bb8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang HK","PingFang TC","Noto Sans CJK HK","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;border:none;color:inherit;background:none;padding:0}
button:focus-visible{outline:4px solid #7c4dff;outline-offset:3px}
.screen{position:fixed;left:0;top:0;width:100%;height:var(--vh);display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}

#start{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;align-items:center;
  background:linear-gradient(165deg,#fff4e8 0%,#ffe8f0 40%,#e8f4ff 100%)}
.startInner{width:min(1080px,94vw);margin:auto;padding:16px 0 28px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vmin,20px)}
h1.title{margin:0;font-size:clamp(28px,5.5vmin,64px);font-weight:900;letter-spacing:2px;text-align:center;line-height:1.2}
h1.title .emoji{display:inline-block;margin:0 .12em}
.sub{margin:0;font-size:clamp(16px,2.8vmin,28px);text-align:center;color:#5a5a6e;line-height:1.45}
.modes{display:flex;gap:clamp(10px,2vmin,20px);width:100%}
.mode{flex:1 1 0;background:var(--card);border-radius:22px;padding:clamp(12px,2vmin,22px);box-shadow:0 6px 0 #e0c8b0;border:5px solid transparent;text-align:center;min-height:90px}
.mode.sel{border-color:#ff9f1c;background:#fffbea}
.mode .mi{font-size:clamp(32px,5.5vmin,60px);line-height:1.1}
.mode .mt{font-size:clamp(22px,3.8vmin,42px);font-weight:900;margin:.1em 0}
.mode .md{font-size:clamp(14px,2.2vmin,24px);line-height:1.35;color:#5a5a6e}
.infoCard{width:100%;background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 4px 0 #e0c8b0;font-size:clamp(15px,2.4vmin,24px);font-weight:700;line-height:1.5;color:#3a3a4a;text-align:center}
.toggles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.toggle{display:flex;align-items:center;gap:8px;background:#fff;padding:8px 16px;border-radius:16px;box-shadow:0 3px 0 #e0c8b0;font-size:clamp(15px,2.4vmin,24px);font-weight:700}
.toggle input{width:22px;height:22px;accent-color:var(--orange)}
.bigbtn{min-width:240px;min-height:clamp(68px,10vmin,100px);padding:0 36px;border-radius:999px;background:var(--orange);color:#fff;font-size:clamp(26px,4.8vmin,50px);font-weight:900;box-shadow:0 7px 0 #c9620b;letter-spacing:3px}
.bigbtn:active,.iconbtn:active,.mode:active,.stepCard:active,.tbtn:active{transform:translateY(3px)}
.bigbtn.green{background:var(--green);box-shadow:0 7px 0 #1d7e3d}
.bigbtn.blue{background:var(--blue);box-shadow:0 7px 0 #1e56b5}
.bigbtn.purple{background:var(--purple);box-shadow:0 7px 0 #5430b0}
.bigbtn:disabled{opacity:.45;transform:none}
.note{font-size:clamp(13px,2vmin,18px);color:#7a8a9a;text-align:center}

#tip{align-items:center;justify-content:center;background:rgba(40,60,90,.45);z-index:20}
.tipCard{width:min(640px,92vw);background:#fff;border-radius:28px;padding:clamp(20px,3vmin,36px);box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vmin,18px)}
.tipEmoji{width:clamp(72px,12vmin,110px);height:clamp(72px,12vmin,110px);border-radius:28px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(36px,7vmin,64px);font-weight:900;color:#fff;background:linear-gradient(160deg,#ff9f4a,#ff6b1a);box-shadow:0 6px 0 #c9620b}
.tipTitle{margin:0;font-size:clamp(28px,5vmin,48px);font-weight:900}
.tipBody{margin:0;font-size:clamp(18px,3.2vmin,32px);line-height:1.55;color:#3a3a4a;font-weight:700}
.tipRule{background:#fff4e8;border-radius:18px;padding:14px 18px;font-size:clamp(16px,2.8vmin,26px);font-weight:800;color:#c2410c;line-height:1.55;width:100%;text-align:left}
.tipHow{font-size:clamp(15px,2.4vmin,24px);color:#5a5a6e;font-weight:700;line-height:1.45}

#play{background:linear-gradient(180deg,#ffe8d6 0%,#fff4e8 35%,#e8f4ff 100%)}
.topbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 4px;flex-wrap:wrap;z-index:5}
.iconbtn{min-width:54px;height:54px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #e0c8b0;font-size:26px;display:flex;align-items:center;justify-content:center}
.pill{font-size:clamp(16px,2.6vmin,28px);font-weight:800;background:#fff;padding:6px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 0 #e0c8b0}
#hearts{letter-spacing:2px;background:#ffe8e8;color:#c62828}
#scorePill{background:#fff1b8}
#qPill{background:#e8f5e9;color:#1b7a3a}
#modeTag{font-size:clamp(13px,2vmin,22px);background:#ede7ff;color:#5b3fc4}
.spacer{flex:1}
#playWrap{position:relative;flex:1 1 0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.playMain{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.5vmin,14px);padding:6px 12px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.prompt{font-size:clamp(18px,3vmin,30px);font-weight:900;text-align:center;color:#1e4a7a}
.problemBox{background:#fff;border-radius:22px;padding:clamp(12px,2vmin,22px) clamp(16px,3vmin,28px);box-shadow:0 6px 0 #e0c8b0;text-align:center;width:min(92vw,560px)}
.problemEq{font-size:clamp(28px,6vmin,52px);font-weight:900;color:#2a2a3a;letter-spacing:1px}
.problemHint{font-size:clamp(14px,2.2vmin,20px);color:#7a7088;font-weight:700;margin-top:4px}
.steps{display:flex;flex-direction:column;gap:10px;width:min(92vw,560px)}
.stepCard{display:flex;align-items:stretch;gap:0;background:#fff;border-radius:18px;box-shadow:0 5px 0 #e0c8b0;border:4px solid transparent;overflow:hidden;text-align:left;min-height:64px}
.stepCard.sel{border-color:#ff9f1c;background:#fffbea}
.stepCard.wrongPick{border-color:var(--red);background:#ffe8e8}
.stepCard.rightPick{border-color:var(--green);background:#e8f8e8}
.stepCard.dim{opacity:.55}
.stepNum{flex:none;width:clamp(48px,8vmin,64px);display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#5bb8ff,#3b82f6);color:#fff;font-size:clamp(22px,4vmin,36px);font-weight:900}
.stepCard.rightPick .stepNum{background:linear-gradient(160deg,#6ee7a0,#22c55e)}
.stepCard.wrongPick .stepNum{background:linear-gradient(160deg,#fca5a5,#ef4444)}
.stepBody{flex:1;padding:12px 14px;font-size:clamp(16px,2.8vmin,26px);font-weight:800;line-height:1.4;display:flex;align-items:center}
.feedback{min-height:1.3em;font-size:clamp(17px,2.8vmin,28px);font-weight:900;text-align:center;width:min(92vw,560px)}
.feedback.ok{color:var(--green)}.feedback.bad{color:var(--red)}.feedback.hint{color:#5a5a6e}
.explainBox{display:none;width:min(92vw,560px);background:#eef6ff;border-radius:18px;padding:14px 16px;text-align:left}
.explainBox.on{display:block}
.explainBox h3{margin:0 0 6px;font-size:clamp(16px,2.6vmin,24px);font-weight:900;color:#1e56b5}
.explainBox p{margin:0;font-size:clamp(15px,2.4vmin,22px);font-weight:700;line-height:1.5;color:#3a3a4a}
.correctWay{margin-top:8px;background:#e8f8e8;border-radius:12px;padding:10px 12px;font-size:clamp(15px,2.4vmin,22px);font-weight:800;color:#1b7a3a;line-height:1.45}
.nextRow{display:none;justify-content:center;padding:4px 0 8px}
.nextRow.on{display:flex}
.teachBar{flex:none;display:none;justify-content:center;gap:12px;padding:4px 10px 12px;flex-wrap:wrap}
.teachBar.on{display:flex}
.tbtn{min-height:52px;padding:0 20px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #e0c8b0;font-size:clamp(16px,2.6vmin,24px);font-weight:800}
.pausedOverlay{position:absolute;inset:0;background:rgba(30,50,80,.55);z-index:15;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.pausedOverlay.on{display:flex}
.pausedOverlay .pt{font-size:clamp(32px,6vmin,56px);font-weight:900;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.3)}

#end{align-items:center;justify-content:center;background:linear-gradient(160deg,#ffe8d6 0%,#ffe0b8 50%,#ffd0e8 100%)}
.endInner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.5vmin,26px);padding:20px}
.endStars{font-size:clamp(44px,9vmin,96px);letter-spacing:6px}
.endTitle{font-size:clamp(32px,6.5vmin,68px);font-weight:900;margin:0}
.endScore{font-size:clamp(22px,3.8vmin,40px);font-weight:800;color:#5a5a6e}
.endDetail{font-size:clamp(16px,2.6vmin,26px);color:#6a6a7e;font-weight:700;line-height:1.5}
.endBtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

@media (max-height:560px){
  .stepCard{min-height:52px}
  .stepBody{font-size:clamp(14px,2.4vmin,20px);padding:8px 10px}
  .iconbtn{min-width:44px;height:44px;font-size:22px}
}
</style>
</head>
<body>
<div id="start" class="screen on">
  <div class="startInner">
    <h1 class="title"><span class="emoji">🔍</span>除法錯中找錯<span class="emoji">✨</span></h1>
    <p class="sub">呢條除法計錯咗！邊一步出錯？點選錯誤嘅步驟。</p>

    <div class="modes">
      <button type="button" class="mode sel" data-mode="student" id="modeStudent">
        <div class="mi">🧒</div>
        <div class="mt">學生模式</div>
        <div class="md">自己揀邊步錯</div>
      </button>
      <button type="button" class="mode" data-mode="teacher" id="modeTeacher">
        <div class="mi">👩‍🏫</div>
        <div class="mt">老師模式</div>
        <div class="md">投影全班投票：可暫停、顯示答案</div>
      </button>
    </div>

    <div class="infoCard">
      常見錯誤：九九乘數錯、商多／少 1、餘數處理錯、被除數同除數搞亂
    </div>

    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="chkSound" checked> 音效</label>
      <label class="toggle"><input type="checkbox" id="chkHard"> 較難（步驟多啲／數字大啲）</label>
    </div>

    <button type="button" class="bigbtn" id="btnStart">開始遊戲</button>
    <p class="note">適合小四 · 整除為主 · 唔使登入 · iPad 用手指點選</p>
  </div>
</div>

<div id="tip" class="screen">
  <div class="tipCard">
    <div class="tipEmoji">!</div>
    <h2 class="tipTitle">點樣玩？</h2>
    <div class="tipRule">
      1. 睇清楚題目同每一步<br>
      2. 點選「出錯」嗰一步（只有一步係錯）<br>
      3. 之後會解釋點解錯，同埋正確做法
    </div>
    <p class="tipBody">答啱加分；答錯扣一顆心 ❤️</p>
    <p class="tipHow">一局約 10 題 · 你有 3 顆心 · 老師模式適合全班投票</p>
    <button type="button" class="bigbtn green" id="btnTipGo">知道了，開始！</button>
  </div>
</div>

<div id="play" class="screen">
  <div class="topbar">
    <button type="button" class="iconbtn" id="btnHome" title="返回">🏠</button>
    <button type="button" class="iconbtn" id="btnPause" title="暫停">⏸</button>
    <span class="pill" id="hearts">❤️❤️❤️</span>
    <span class="pill" id="scorePill">⭐ 0</span>
    <span class="pill" id="qPill">第 1／10 題</span>
    <span class="spacer"></span>
    <span class="pill" id="modeTag">學生</span>
  </div>
  <div id="playWrap">
    <div class="playMain">
      <div class="prompt">邊一步出錯？點選錯誤的步驟</div>
      <div class="problemBox">
        <div class="problemEq" id="problemEq">84 ÷ 7 = ?</div>
        <div class="problemHint" id="problemHint">有人咁樣計：</div>
      </div>
      <div class="steps" id="steps"></div>
      <div class="feedback" id="feedback"></div>
      <div class="explainBox" id="explainBox">
        <h3 id="explainTitle">為什麼錯？</h3>
        <p id="explainText"></p>
        <div class="correctWay" id="correctWay"></div>
      </div>
      <div class="nextRow" id="nextRow">
        <button type="button" class="bigbtn green" id="btnNext" style="min-width:200px;min-height:60px;font-size:clamp(20px,3.5vmin,32px)">下一題 →</button>
      </div>
    </div>
    <div class="teachBar" id="teachBar">
      <button type="button" class="tbtn" id="btnReveal">💡 顯示錯在哪</button>
      <button type="button" class="tbtn" id="btnNextTeach">下一題 →</button>
    </div>
    <div class="pausedOverlay" id="pausedOv">
      <div class="pt">⏸ 暫停</div>
      <button type="button" class="bigbtn blue" id="btnResume">繼續</button>
    </div>
  </div>
</div>

<div id="end" class="screen">
  <div class="endInner">
    <div class="endStars" id="endStars">⭐⭐⭐</div>
    <h2 class="endTitle" id="endTitle">太棒了！</h2>
    <div class="endScore" id="endScore">得分：0</div>
    <div class="endDetail" id="endDetail"></div>
    <div class="endBtns">
      <button type="button" class="bigbtn green" id="btnAgain">再玩一次</button>
      <button type="button" class="bigbtn purple" id="btnMenu">返回主選單</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

function setVH(){
  var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', h + 'px');
}
setVH();
window.addEventListener('resize', setVH);
if(window.visualViewport) window.visualViewport.addEventListener('resize', setVH);

var TOTAL_Q = 10;

var state = {
  mode:'student',
  sound:true,
  hard:false,
  lives:3,
  score:0,
  correct:0,
  wrongs:0,
  qIndex:0,
  questions:[],
  current:null,
  playing:false,
  paused:false,
  locked:false
};

var el = {
  hearts:document.getElementById('hearts'),
  scorePill:document.getElementById('scorePill'),
  qPill:document.getElementById('qPill'),
  modeTag:document.getElementById('modeTag'),
  problemEq:document.getElementById('problemEq'),
  problemHint:document.getElementById('problemHint'),
  steps:document.getElementById('steps'),
  feedback:document.getElementById('feedback'),
  explainBox:document.getElementById('explainBox'),
  explainTitle:document.getElementById('explainTitle'),
  explainText:document.getElementById('explainText'),
  correctWay:document.getElementById('correctWay'),
  nextRow:document.getElementById('nextRow'),
  teachBar:document.getElementById('teachBar'),
  pausedOv:document.getElementById('pausedOv'),
  endStars:document.getElementById('endStars'),
  endTitle:document.getElementById('endTitle'),
  endScore:document.getElementById('endScore'),
  endDetail:document.getElementById('endDetail')
};

function show(screen){
  ['start','tip','play','end'].forEach(function(id){
    document.getElementById(id).classList.toggle('on', id===screen);
  });
}

var audioCtx = null;
function ensureAudio(){
  if(!state.sound) return null;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function beep(freq, dur, type, vol){
  var ctx = ensureAudio();
  if(!ctx) return;
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.type = type||'sine';
  o.frequency.value = freq;
  g.gain.value = vol||0.08;
  o.connect(g); g.connect(ctx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (dur||0.15));
  o.stop(ctx.currentTime + (dur||0.15) + 0.02);
}
function sfxGood(){ beep(660,.1,'triangle',.1); setTimeout(function(){ beep(880,.12,'triangle',.08); },80); }
function sfxBad(){ beep(220,.18,'sawtooth',.07); }
function sfxStar(){ beep(523,.08); setTimeout(function(){ beep(659,.08); },70); setTimeout(function(){ beep(784,.14); },140); }

function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}

/* Generate exact division facts suitable for P4 */
function exactFact(hard){
  var d = randInt(2,9);
  var q = hard ? randInt(8, 25) : randInt(3, 12);
  var n = d * q;
  if(!hard && n > 99){ q = randInt(3, Math.floor(99/d)); n = d * q; }
  if(hard && n < 40){ q = randInt(12, Math.min(40, Math.floor(200/d))); n = d * q; }
  return { n:n, d:d, q:q };
}

/*
  Error templates produce:
  - equation display
  - steps[] text
  - wrongIndex (0-based)
  - explanation
  - correctWay
*/
function makeTimesError(hard){
  var f = exactFact(hard);
  // wrong times-table: claim divisor * wrongQ = n, or wrong product in check
  var wrongQ = f.q + (Math.random()<0.5 ? 1 : -1);
  if(wrongQ < 2) wrongQ = f.q + 1;
  var wrongProduct = f.d * wrongQ;
  var steps = [
    '想：' + f.d + ' × □ = ' + f.n,
    '用九九：' + f.d + ' × ' + wrongQ + ' = ' + f.n,
    '所以商是 ' + wrongQ,
    '驗算：' + f.d + ' × ' + wrongQ + ' = ' + wrongProduct
  ];
  // Use 3 steps in easy: hide last or merge
  if(!hard){
    steps = [
      '想：' + f.d + ' × □ = ' + f.n,
      '用九九：' + f.d + ' × ' + wrongQ + ' = ' + f.n + '，所以商 = ' + wrongQ,
      '寫答案：' + f.n + ' ÷ ' + f.d + ' = ' + wrongQ
    ];
  }
  return {
    eq: f.n + ' ÷ ' + f.d + ' = ?',
    steps: steps,
    wrongIndex: 1,
    explain: '九九乘數記錯咗。' + f.d + ' × ' + wrongQ + ' = ' + wrongProduct + '，唔等於 ' + f.n + '。',
    correct: '正確：' + f.d + ' × ' + f.q + ' = ' + f.n + '，所以 ' + f.n + ' ÷ ' + f.d + ' = ' + f.q
  };
}

function makeOffByOne(hard){
  var f = exactFact(hard);
  var wrongQ = f.q + (Math.random()<0.5 ? 1 : -1);
  if(wrongQ < 1) wrongQ = f.q + 1;
  var steps = [
    '被除數是 ' + f.n + '，除數是 ' + f.d,
    '估計商大約是 ' + f.q + ' 左右',
    '決定商 = ' + wrongQ,
    '沒有用乘法驗算就寫答案'
  ];
  if(!hard){
    steps = [
      '題目：' + f.n + ' ÷ ' + f.d,
      '以為商是 ' + wrongQ,
      '答案寫成 ' + f.n + ' ÷ ' + f.d + ' = ' + wrongQ
    ];
    return {
      eq: f.n + ' ÷ ' + f.d + ' = ?',
      steps: steps,
      wrongIndex: 1,
      explain: '商多咗或少咗 1。要用乘法驗算：除數 × 商 應該等於被除數。',
      correct: '正確：' + f.d + ' × ' + f.q + ' = ' + f.n + '，所以商是 ' + f.q
    };
  }
  return {
    eq: f.n + ' ÷ ' + f.d + ' = ?',
    steps: steps,
    wrongIndex: 2,
    explain: '商寫錯咗，差 1。' + f.d + ' × ' + wrongQ + ' ≠ ' + f.n + '。',
    correct: '正確：' + f.n + ' ÷ ' + f.d + ' = ' + f.q + '（因為 ' + f.d + ' × ' + f.q + ' = ' + f.n + '）'
  };
}

function makeSwapError(hard){
  var f = exactFact(hard);
  // conceptually swap: treat as d ÷ n or write n as divisor
  var steps = [
    '題目寫住 ' + f.n + ' ÷ ' + f.d,
    '改成用 ' + f.d + ' ÷ ' + f.n + ' 嚟計',
    '得出好細／唔合理嘅商',
    '寫低最後答案'
  ];
  if(!hard){
    steps = [
      '題目：' + f.n + ' ÷ ' + f.d,
      '用 ' + f.d + ' ÷ ' + f.n + ' 嚟諗',
      '得出答案'
    ];
  }
  return {
    eq: f.n + ' ÷ ' + f.d + ' = ?',
    steps: steps,
    wrongIndex: 1,
    explain: '被除數同除數唔可以調轉。要計嘅係「' + f.n + ' 裏面有幾多個 ' + f.d + '」。',
    correct: '正確：' + f.n + ' ÷ ' + f.d + ' = ' + f.q
  };
}

function makeRemainderFake(hard){
  // exact division but student invents a remainder or leftover
  var f = exactFact(hard);
  var fakeR = randInt(1, f.d - 1);
  var steps = [
    '用 ' + f.d + ' 去除 ' + f.n,
    '商取 ' + f.q + '，餘數寫 ' + fakeR,
    '以為 ' + f.n + ' = ' + f.d + ' × ' + f.q + ' + ' + fakeR,
    '其實 ' + f.d + ' × ' + f.q + ' 已經剛好等於 ' + f.n + '，無餘數'
  ];
  if(!hard){
    steps = [
      '題目：' + f.n + ' ÷ ' + f.d,
      '寫成商 ' + f.q + ' 餘 ' + fakeR,
      '答案：' + f.q + ' …… ' + fakeR
    ];
    return {
      eq: f.n + ' ÷ ' + f.d + ' = ?',
      steps: steps,
      wrongIndex: 1,
      explain: '呢題係整除，無餘數。' + f.d + ' × ' + f.q + ' = ' + f.n + '，唔使寫餘數。',
      correct: '正確：' + f.n + ' ÷ ' + f.d + ' = ' + f.q + '（餘 0）'
    };
  }
  return {
    eq: f.n + ' ÷ ' + f.d + ' = ?',
    steps: steps,
    wrongIndex: 1,
    explain: '多寫咗餘數。驗算：除數 × 商 + 餘數 應該等於被除數；呢度加咗餘數就大過被除數。',
    correct: '正確：' + f.n + ' ÷ ' + f.d + ' = ' + f.q
  };
}

function makeBringDown(hard){
  // 2-digit short division style mistake on tens/ones
  var d = randInt(2,9);
  var tensQ = randInt(1, 8);
  var onesQ = randInt(0, 9);
  // build n = d * (10*tensQ + onesQ) exact
  var q = 10 * tensQ + onesQ;
  if(q < 12){ tensQ = randInt(2,6); onesQ = randInt(1,8); q = 10*tensQ+onesQ; }
  var n = d * q;
  if(n > 99 && !hard){
    // keep 2-digit when possible
    q = randInt(12, Math.min(48, Math.floor(99/d)));
    n = d * q;
    tensQ = Math.floor(q/10);
    onesQ = q % 10;
  }
  var wrongOnes = (onesQ + 1) % 10;
  if(wrongOnes === onesQ) wrongOnes = (onesQ + 2) % 10;
  var wrongQ = 10 * tensQ + wrongOnes;
  var steps = [
    '短除法：用 ' + d + ' 去除 ' + n,
    '十位商寫 ' + tensQ,
    '個位商寫 ' + wrongOnes,
    '最後商是 ' + wrongQ
  ];
  if(!hard){
    steps = [
      '短除：' + n + ' ÷ ' + d,
      '個位商寫 ' + wrongOnes,
      '所以答案是 ' + wrongQ
    ];
    return {
      eq: n + ' ÷ ' + d + ' = ?',
      steps: steps,
      wrongIndex: 1,
      explain: '個位嘅商計錯（寫成 ' + wrongOnes + '，應該係 ' + onesQ + '）。要用乘法檢查每一步。',
      correct: '正確：' + n + ' ÷ ' + d + ' = ' + q
    };
  }
  return {
    eq: n + ' ÷ ' + d + ' = ?',
    steps: [
      '短除法：用 ' + d + ' 去除 ' + n,
      '十位商寫 ' + tensQ,
      '個位商寫 ' + wrongOnes,
      '最後商是 ' + wrongQ
    ],
    wrongIndex: 2,
    explain: '帶落嚟個位之後計錯，個位商應該係 ' + onesQ + ' 而唔係 ' + wrongOnes + '。',
    correct: '正確步驟應得出商 ' + q + '（因為 ' + d + ' × ' + q + ' = ' + n + '）'
  };
}

function makePuzzle(kind, hard){
  if(kind === 'times') return makeTimesError(hard);
  if(kind === 'off') return makeOffByOne(hard);
  if(kind === 'swap') return makeSwapError(hard);
  if(kind === 'rem') return makeRemainderFake(hard);
  return makeBringDown(hard);
}

function buildRound(){
  var kinds = [];
  var pool = ['times','off','swap','rem','bring'];
  for(var i=0;i<TOTAL_Q;i++) kinds.push(pool[i % pool.length]);
  shuffle(kinds);
  var qs = [];
  for(var j=0;j<TOTAL_Q;j++) qs.push(makePuzzle(kinds[j], state.hard));
  return qs;
}

function updateHUD(){
  var h = '';
  for(var i=0;i<3;i++) h += i < state.lives ? '❤️' : '🖤';
  el.hearts.textContent = h;
  el.scorePill.textContent = '⭐ ' + state.score;
  el.qPill.textContent = '第 ' + Math.min(state.qIndex+1, TOTAL_Q) + '／' + TOTAL_Q + ' 題';
  el.modeTag.textContent = state.mode==='teacher' ? '老師' : '學生';
}

function setFeedback(text, cls){
  el.feedback.textContent = text || '';
  el.feedback.className = 'feedback' + (cls ? ' ' + cls : '');
}

function startRound(){
  state.lives = 3;
  state.score = 0;
  state.correct = 0;
  state.wrongs = 0;
  state.qIndex = 0;
  state.questions = buildRound();
  state.playing = true;
  state.paused = false;
  state.locked = false;
  el.pausedOv.classList.remove('on');
  el.teachBar.classList.toggle('on', state.mode === 'teacher');
  show('play');
  loadQuestion();
}

function loadQuestion(){
  if(state.qIndex >= state.questions.length || state.lives <= 0){
    finish();
    return;
  }
  state.current = state.questions[state.qIndex];
  state.locked = false;
  setFeedback('', '');
  el.explainBox.classList.remove('on');
  el.nextRow.classList.remove('on');
  updateHUD();
  renderQuestion();
}

function renderQuestion(){
  var q = state.current;
  el.problemEq.textContent = q.eq;
  el.problemHint.textContent = '有人咁樣計——邊一步出錯？';
  el.steps.innerHTML = '';
  q.steps.forEach(function(text, i){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'stepCard';
    btn.setAttribute('data-i', String(i));
    btn.innerHTML = '<div class="stepNum">' + (i+1) + '</div><div class="stepBody">' + text + '</div>';
    btn.addEventListener('click', function(){ onPick(i); });
    el.steps.appendChild(btn);
  });
}

function showExplain(){
  var q = state.current;
  el.explainTitle.textContent = '為什麼錯？';
  el.explainText.textContent = q.explain;
  el.correctWay.textContent = q.correct;
  el.explainBox.classList.add('on');
  el.nextRow.classList.add('on');
}

function highlightResult(picked, ok){
  var cards = el.steps.querySelectorAll('.stepCard');
  var q = state.current;
  cards.forEach(function(card, i){
    card.classList.remove('sel','wrongPick','rightPick','dim');
    if(i === q.wrongIndex) card.classList.add('rightPick');
    else if(i === picked && !ok) card.classList.add('wrongPick');
    else card.classList.add('dim');
  });
}

function onPick(i){
  if(!state.playing || state.paused || state.locked) return;
  state.locked = true;
  var q = state.current;
  var ok = (i === q.wrongIndex);
  highlightResult(i, ok);
  if(ok){
    state.correct++;
    state.score += state.hard ? 15 : 10;
    setFeedback('搵中！就係呢一步 🎉', 'ok');
    sfxGood();
    updateHUD();
  } else {
    state.wrongs++;
    state.lives--;
    setFeedback('唔係呢步——正確係第 ' + (q.wrongIndex+1) + ' 步', 'bad');
    sfxBad();
    updateHUD();
  }
  showExplain();
  if(state.lives <= 0){
    setTimeout(finish, 2200);
  }
}

function revealAnswer(){
  if(!state.playing || !state.current || state.locked) {
    // still allow reveal highlight if already locked
  }
  state.locked = true;
  var q = state.current;
  highlightResult(q.wrongIndex, true);
  setFeedback('錯在第 ' + (q.wrongIndex+1) + ' 步（課堂討論）', 'hint');
  showExplain();
}

function goNext(){
  if(!state.playing) return;
  if(state.lives <= 0){ finish(); return; }
  state.qIndex++;
  loadQuestion();
}

function finish(){
  state.playing = false;
  var stars = 1;
  if(state.correct >= 8 && state.lives >= 2) stars = 3;
  else if(state.correct >= 5 || state.lives >= 1) stars = 2;
  var starStr = '';
  for(var i=0;i<3;i++) starStr += i < stars ? '⭐' : '☆';
  el.endStars.textContent = starStr;
  el.endTitle.textContent = stars === 3 ? '火眼金睛！' : (stars === 2 ? '做得好！' : '繼續加油！');
  el.endScore.textContent = '得分：' + state.score;
  el.endDetail.textContent = '搵中 ' + state.correct + ' 題 · 答錯 ' + state.wrongs + ' 題 · 剩餘 ' + state.lives + ' 心';
  sfxStar();
  show('end');
}

function goHome(){
  state.playing = false;
  state.paused = false;
  el.pausedOv.classList.remove('on');
  show('start');
}

function togglePause(){
  if(!state.playing) return;
  state.paused = !state.paused;
  el.pausedOv.classList.toggle('on', state.paused);
}

document.querySelectorAll('.mode').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.mode').forEach(function(b){ b.classList.remove('sel'); });
    btn.classList.add('sel');
    state.mode = btn.getAttribute('data-mode');
  });
});
document.getElementById('chkSound').addEventListener('change', function(){ state.sound = this.checked; });
document.getElementById('chkHard').addEventListener('change', function(){ state.hard = this.checked; });
document.getElementById('btnStart').addEventListener('click', function(){
  state.sound = document.getElementById('chkSound').checked;
  state.hard = document.getElementById('chkHard').checked;
  ensureAudio();
  show('tip');
});
document.getElementById('btnTipGo').addEventListener('click', startRound);
document.getElementById('btnHome').addEventListener('click', goHome);
document.getElementById('btnPause').addEventListener('click', togglePause);
document.getElementById('btnResume').addEventListener('click', function(){ state.paused=false; el.pausedOv.classList.remove('on'); });
document.getElementById('btnReveal').addEventListener('click', revealAnswer);
document.getElementById('btnNextTeach').addEventListener('click', goNext);
document.getElementById('btnNext').addEventListener('click', goNext);
document.getElementById('btnAgain').addEventListener('click', function(){ show('tip'); });
document.getElementById('btnMenu').addEventListener('click', goHome);

})();
</script>
</body>
</html>
