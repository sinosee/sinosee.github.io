<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f0e6">
  <title>廣東話小幫手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <section id="screen-home" class="screen is-active" aria-label="主頁">
      <header class="hero">
        <div class="mascot" aria-hidden="true">
          <svg viewBox="0 0 120 120" width="112" height="112">
            <circle cx="60" cy="60" r="54" fill="#ffe8a3"/>
            <circle cx="60" cy="60" r="54" fill="none" stroke="#e8b84a" stroke-width="4"/>
            <circle cx="42" cy="52" r="6" fill="#1c2a32"/>
            <circle cx="78" cy="52" r="6" fill="#1c2a32"/>
            <path d="M40 76c8 12 32 12 40 0" fill="none" stroke="#1c2a32" stroke-width="4" stroke-linecap="round"/>
            <path d="M18 28c8-16 22-10 24 2" fill="none" stroke="#d4540a" stroke-width="5" stroke-linecap="round"/>
            <path d="M102 28c-8-16-22-10-24 2" fill="none" stroke="#d4540a" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="title">廣東話小幫手</h1>
        <p class="tagline">拍攝課文，練習廣東話對答</p>
      </header>

      <div class="home-grid">
        <button type="button" class="home-card" data-go="listen" id="btn-go-listen">
          <span class="home-card-icon" aria-hidden="true">📷</span>
          <span class="home-card-label">拍攝讀字</span>
          <span class="home-card-hint">拍攝課文，用廣東話朗讀</span>
        </button>
        <button type="button" class="home-card home-card-talk" data-go="talk" id="btn-go-talk">
          <span class="home-card-icon" aria-hidden="true">💬</span>
          <span class="home-card-label">對答</span>
          <span class="home-card-hint">用普通話提問，聽廣東話回答</span>
        </button>
      </div>

      <p class="voice-banner" id="home-voice-note" hidden></p>
    </section>

    <section id="screen-listen" class="screen" aria-label="拍攝讀字">
      <header class="screen-bar">
        <button type="button" class="back-btn" data-go="home" id="btn-listen-back">返回</button>
        <h2>拍攝讀字</h2>
        <span class="bar-spacer"></span>
      </header>

      <input id="camera-input" class="visually-hidden" type="file" accept="image/*" capture="environment">
      <input id="album-input" class="visually-hidden" type="file" accept="image/*">

      <div id="listen-empty" class="panel empty-panel">
        <p class="lead">請拍攝課文，辨認文字後會用廣東話朗讀。照片只在這部裝置處理，不會上載。</p>
        <div class="teacher-actions capture-actions">
          <button type="button" class="btn btn-primary btn-lg" id="btn-camera">拍攝課文</button>
          <button type="button" class="btn btn-secondary btn-lg" id="btn-album">從相簿選擇</button>
        </div>
      </div>

      <div id="listen-progress" class="panel empty-panel" hidden>
        <p class="lead" id="ocr-progress-text">正在辨認文字，請稍候。第一次使用需要下載辨識資料，請保持網絡連接。</p>
        <div class="ocr-bar" aria-hidden="true"><span id="ocr-bar-fill"></span></div>
      </div>

      <div id="listen-ready" class="listen-layout" hidden>
        <img id="photo-preview" class="photo-preview" alt="已拍攝的課文照片">
        <div class="lesson-board" id="lesson-board" tabindex="0" aria-label="辨認到的文字"></div>
        <p class="voice-banner" id="listen-voice-note" hidden></p>
        <div class="transport">
          <button type="button" class="btn btn-primary btn-lg" id="btn-play">播放</button>
          <button type="button" class="btn btn-secondary btn-lg" id="btn-pause">暫停</button>
          <button type="button" class="btn btn-secondary btn-lg" id="btn-replay">重播</button>
        </div>
        <p class="listen-state" id="listen-state" role="status"></p>
        <div class="teacher-actions capture-actions">
          <button type="button" class="btn btn-secondary" id="btn-retake">再拍攝</button>
          <button type="button" class="btn btn-secondary" id="btn-add-page">加入另一頁</button>
          <button type="button" class="btn btn-danger" id="btn-clear-text">清除文字</button>
        </div>
      </div>
    </section>

    <section id="screen-talk" class="screen" aria-label="對答">
      <header class="screen-bar">
        <button type="button" class="back-btn" data-go="home" id="btn-talk-back">返回</button>
        <h2>對答</h2>
        <span class="bar-spacer"></span>
      </header>

      <p class="talk-intro">請用普通話提問日常生活的事情。小幫手會用廣東話回答，並且出聲播放。</p>
      <p class="voice-banner" id="talk-voice-note" hidden></p>

      <div class="transcript" id="transcript" aria-live="polite"></div>

      <div class="listen-indicator" id="listen-indicator" hidden>
        <span class="pulse" aria-hidden="true"></span>
        <strong>正在聆聽</strong>
        <span id="interim-text" class="interim"></span>
      </div>

      <div class="talk-controls">
        <button type="button" class="btn btn-primary btn-mic" id="btn-mic">開始對話</button>
        <button type="button" class="btn btn-secondary" id="btn-stop-listen" hidden>停止聆聽</button>
      </div>
      <p class="mic-hint" id="mic-hint"></p>

      <form class="type-row" id="type-form">
        <label class="visually-hidden" for="type-input">輸入問題</label>
        <input id="type-input" class="field-input" type="text" maxlength="120" autocomplete="off" placeholder="也可以在此輸入問題">
        <button type="submit" class="btn btn-primary" id="btn-send">發送</button>
      </form>

      <p class="topic-label">試試這些話題</p>
      <div class="topics" id="topics"></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
